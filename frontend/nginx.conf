server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing (react-router-dom) -- any path that isn't a real
    # static file falls back to index.html so deep links work on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
