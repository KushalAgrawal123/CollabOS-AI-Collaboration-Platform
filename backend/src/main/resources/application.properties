spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5432/collabos
spring.datasource.username=collabos
spring.datasource.password=collabos

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

app.cors.allowed-origin=http://localhost:5173

app.jwt.secret=${JWT_SECRET:dev-only-local-secret-key-change-before-any-real-deployment-32bytes+}
app.jwt.expiration-ms=86400000

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

spring.data.redis.host=localhost
spring.data.redis.port=6379

app.ratelimit.login.max-attempts=30
app.ratelimit.login.window-seconds=60

app.storage.root-dir=./uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=collabos-backend
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
# JsonDeserializer refuses to deserialize into a class from an untrusted package by default
# (a real defense against deserialization-gadget attacks) -- scoped to just our own event
# records rather than trusting everything, same reasoning as the Redis cache's
# PolymorphicTypeValidator scoping in Phase 5.
spring.kafka.consumer.properties.spring.json.trusted.packages=com.collabos.backend.event

# Python ai-service (Phase 10) -- separate process, not managed by Spring. If it's down,
# AiService catches the connection failure and reports the AI features as unavailable
# rather than the whole request chain failing.
app.aiservice.url=http://localhost:8000
